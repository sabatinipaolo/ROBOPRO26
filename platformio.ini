[env:blackpill_f411ce]
platform = ststm32
board = blackpill_f411ce
framework = arduino
upload_protocol = stlink

build_src_filter =  
; +<main.cpp> +<my_lib/> -<test/>

;per eseguire un test commentare la riga sopra e 
;decommentare la riga corrispondente, lasciare almeno uno spazio
   -<main.cpp> +<my_lib/> +<my_test/blackpill_blink_a_led.cpp>
